name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL }}
      PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
      PUBLIC_TIKTOK_URL: ${{ vars.PUBLIC_TIKTOK_URL }}
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      PUBLIC_URL_KASIR_DAENG: ${{ vars.PUBLIC_URL_KASIR_DAENG }}
      PUBLIC_URL_PINTARA: ${{ vars.PUBLIC_URL_PINTARA }}
      PUBLIC_URL_DUOPOP: ${{ vars.PUBLIC_URL_DUOPOP }}
      PUBLIC_URL_FINANCEPAY: ${{ vars.PUBLIC_URL_FINANCEPAY }}
      PUBLIC_URL_BIMTRACK: ${{ vars.PUBLIC_URL_BIMTRACK }}
      PUBLIC_URL_TIDAL_TALES: ${{ vars.PUBLIC_URL_TIDAL_TALES }}
      PUBLIC_URL_MEMORY_MBS: ${{ vars.PUBLIC_URL_MEMORY_MBS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # BASE_PATH: pakai vars.BASE_PATH bila diisi, jika tidak pakai nama repo ("/" untuk repo *.github.io).
      - name: Resolve base path
        env:
          VAR_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$VAR_BASE_PATH" ]; then
            BASE="$VAR_BASE_PATH"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO"
          fi
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Base path: $BASE"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
